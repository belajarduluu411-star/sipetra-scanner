<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">

  <title>Absensi SIPETRA - SMAN 12 LUWU</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .header {
      background: linear-gradient(135deg, #1a73e8, #263b91);
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 15px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .petunjuk {
      text-align: center;
      margin-bottom: 25px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    #hasilScan {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #eef5ff;
      text-align: center;
      font-size: 16px;
      display: none;
    }

    .success {
      color: #137333;
      font-weight: bold;
    }

    .error {
      color: #c5221f;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .container {
        margin: 15px;
        padding: 20px;
      }

      .header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>📷 Absensi SIPETRA</h1>
    <p>SMAN 12 LUWU</p>
  </div>

  <div class="container">

    <h2>Absensi Siswa</h2>

    <div class="petunjuk">
      Silakan scan QR Code pada kartu siswa.
    </div>

    <div id="reader"></div>

    <div id="hasilScan"></div>

  </div>

  <script> 

   let sedangProsesAbsensi = false;
// Integrasi API Absensi SIPETRA
function onScanSuccess(decodedText, decodedResult) {

  if (sedangProsesAbsensi) {
    return;
  }

  sedangProsesAbsensi = true;

  const hasil = document.getElementById("hasilScan");

  hasil.style.display = "block";

  hasil.innerHTML =
    "<div class='success'>⏳ QR berhasil dibaca</div>" +
    "<br>" +
    "<b>Student ID:</b> " + decodedText +
    "<br><br>" +
    "⏳ Mengirim data absensi ke SIPETRA...";

  const studentId = decodedText.trim();

  const callbackName = "absensiCallback_" + Date.now();

  window[callbackName] = function(data) {

    if (data && data.success) {

      hasil.innerHTML =
        "<div class='success'>✅ ABSENSI BERHASIL</div>" +
        "<br>" +
        "<b>Nama:</b> " + data.nama +
        "<br>" +
        "<b>Student ID:</b> " + data.studentId +
        "<br>" +
        "<b>Kelas:</b> " + data.kelas +
        "<br>" +
        "<b>Tanggal:</b> " + data.tanggal +
        "<br>" +
        "<b>Jam:</b> " + data.jam +
        "<br>" +
        "<b>Status:</b> " + data.status +
        "<br>" +
        "<b>Metode:</b> " + data.metode;

    } else {

      hasil.innerHTML =
        "<div class='error'>❌ ABSENSI GAGAL</div>" +
        "<br>" +
        (data && data.message
          ? data.message
          : "Data absensi tidak dapat diproses.");
    }

    sedangProsesAbsensi = false;

    delete window[callbackName];

    const scriptLama = document.getElementById(callbackName);

    if (scriptLama) {
      scriptLama.remove();
    }
  };

  const script = document.createElement("script");

  script.id = callbackName;

  script.src =
    "https://script.google.com/macros/s/AKfycbxYQsvxsEEwqfUe8e6LxGjnEB-CefWzqvYQX45Hz0MWNiF9Rb2eTftl6owepkcHd4d_Pg/exec" +
    "?api=absensi" +
    "&studentId=" + encodeURIComponent(studentId) +
    "&callback=" + callbackName;

  script.onerror = function() {

    hasil.innerHTML =
      "<div class='error'>❌ Gagal terhubung ke SIPETRA</div>" +
      "<br>Silakan coba scan kembali.";

    sedangProsesAbsensi = false;

    delete window[callbackName];

    script.remove();
  };

  document.body.appendChild(script);
}

    function onScanFailure(error) {
      // Scanner tetap berjalan.
    }

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );

    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  </script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("SIPETRA Service Worker aktif"))
      .catch(error => console.error("Service Worker gagal:", error));
  }
</script>
</body>
</html>
