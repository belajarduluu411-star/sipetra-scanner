<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">

  <title>Absensi SIPETRA - SMAN 12 LUWU</title>
<script src="./html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .header {
      background: linear-gradient(135deg, #1a73e8, #263b91);
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 15px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .petunjuk {
      text-align: center;
      margin-bottom: 25px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    #hasilScan {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #eef5ff;
      text-align: center;
      font-size: 16px;
      display: none;
    }

    .success {
      color: #137333;
      font-weight: bold;
    }

    .error {
      color: #c5221f;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .container {
        margin: 15px;
        padding: 20px;
      }

      .header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <div id="statusKoneksi"
     style="text-align:center; padding:8px; font-weight:bold;">
  🟢 Online — terhubung ke SIPETRA
</div>

  <div class="header">
    <h1>📷 Absensi SIPETRA</h1>
    <p>SMAN 12 LUWU</p>
  </div>

  <div class="container">

    <h2>Absensi Siswa</h2>

    <div class="petunjuk">
      Silakan scan QR Code pada kartu siswa.
    </div>

    <div id="reader"></div>

    <div id="hasilScan"></div>

  </div>

  <script> 
window.onerror = function(message, source, lineno, colno, error) {
  const reader = document.getElementById("reader");

  if (reader) {
    reader.innerHTML =
      "<div style='color:red;font-weight:bold;padding:15px;'>" +
      "ERROR JAVASCRIPT:<br>" +
      message +
      "<br>Baris: " +
      lineno +
      "</div>";
  }

  return false;
};
   let sedangProsesAbsensi = false;
// Integrasi API Absensi SIPETRA
    function simpanAbsensiOffline(studentId) {
  const antrean = JSON.parse(
    localStorage.getItem("sipetraAbsensiOffline") || "[]"
  );

  antrean.push({
    studentId: studentId,
    waktuScan: new Date().toISOString()
  });

  localStorage.setItem(
    "sipetraAbsensiOffline",
    JSON.stringify(antrean)
  );
}
function onScanSuccess(decodedText, decodedResult) {

  if (sedangProsesAbsensi) {
    return;
  }

  sedangProsesAbsensi = true;

  const hasil = document.getElementById("hasilScan");

  hasil.style.display = "block";

  hasil.innerHTML =
    "<div class='success'>⏳ QR berhasil dibaca</div>" +
    "<br>" +
    "<b>Student ID:</b> " + decodedText +
    "<br><br>" +
    "⏳ Mengirim data absensi ke SIPETRA...";

  const studentId = decodedText.trim();

  const callbackName = "absensiCallback_" + Date.now();

  window[callbackName] = function(data) {

    if (data && data.success) {

      const pesanWA =
  "ABSENSI SIPETRA%0A%0A" +
  "Nama: " + encodeURIComponent(data.nama) + "%0A" +
  "Student ID: " + encodeURIComponent(data.studentId) + "%0A" +
  "Kelas: " + encodeURIComponent(data.kelas) + "%0A" +
  "Tanggal: " + encodeURIComponent(data.tanggal) + "%0A" +
  "Jam: " + encodeURIComponent(data.jam) + "%0A" +
  "Status: " + encodeURIComponent(data.status) + "%0A" +
  "Metode: " + encodeURIComponent(data.metode);

const tombolOrtu = data.noWhatsAppOrtu
  ? "<br><a href='https://wa.me/" + data.noWhatsAppOrtu +
    "?text=" + pesanWA +
    "' target='_blank' style='display:inline-block;margin:5px;padding:10px 15px;background:#25D366;color:white;text-decoration:none;border-radius:8px;'>📱 WhatsApp Orang Tua</a>"
  : "";

const tombolWali = data.noWhatsAppWali
  ? "<br><a href='https://wa.me/" + data.noWhatsAppWali +
    "?text=" + pesanWA +
    "' target='_blank' style='display:inline-block;margin:5px;padding:10px 15px;background:#25D366;color:white;text-decoration:none;border-radius:8px;'>👨‍🏫 WhatsApp Wali Kelas</a>"
  : "";
const tombolBK1 =
  data.status === "Terlambat" && data.noWhatsAppBK1
  ? "<br><a href='https://wa.me/" + data.noWhatsAppBK1 +
    "?text=" + pesanWA +
    "' target='_blank' style='display:inline-block;margin:5px;padding:10px 15px;background:#25D366;color:white;text-decoration:none;border-radius:5px;'>👨‍💼 WhatsApp Guru BK 1</a>"
  : "";

const tombolBK2 =
  data.status === "Terlambat" && data.noWhatsAppBK2
  ? "<br><a href='https://wa.me/" + data.noWhatsAppBK2 +
    "?text=" + pesanWA +
    "' target='_blank' style='display:inline-block;margin:5px;padding:10px 15px;background:#25D366;color:white;text-decoration:none;border-radius:5px;'>👨‍💼 WhatsApp Guru BK 2</a>"
  : "";

const tombolBK = tombolBK1 + tombolBK2;
hasil.innerHTML =
  "<div class='success'>✅ ABSENSI BERHASIL</div>" +
  "<br>" +
  "<b>Nama:</b> " + data.nama +
  "<br>" +
  "<b>Student ID:</b> " + data.studentId +
  "<br>" +
  "<b>Kelas:</b> " + data.kelas +
  "<br>" +
  "<b>Tanggal:</b> " + data.tanggal +
  "<br>" +
  "<b>Jam:</b> " + data.jam +
  "<br>" +
  "<b>Status:</b> " + data.status +
  "<br>" +
  "<b>Metode:</b> " + data.metode +
 "<br><br>" +
tombolOrtu +
tombolWali +
tombolBK;    } else {

      hasil.innerHTML =
        "<div class='error'>❌ ABSENSI GAGAL</div>" +
        "<br>" +
        (data && data.message
          ? data.message
          : "Data absensi tidak dapat diproses.");
    }
    sedangProsesAbsensi = false;

    delete window[callbackName];

    const scriptLama = document.getElementById(callbackName);

    if (scriptLama) {
      scriptLama.remove();
    }
  };

  const script = document.createElement("script");

  script.id = callbackName;
  script.async = true;
script.src =
  "https://script.google.com/macros/s/AKfycbxYQsvxsEEwqfUe8e6LxGjnEB-CefWzqvYQX45Hz0MWNiF9Rb2eTftl6owepkcHd4d_Pg/exec" +
  "?api=absensi" +
  "&studentId=" + encodeURIComponent(studentId) +
  "&callback=" + callbackName;

  script.onerror = function() {

  try {
    simpanAbsensiOffline(studentId);

    hasil.innerHTML =
      "<div class='success'>📴 ABSENSI TERSIMPAN OFFLINE</div>" +
      "<br>" +
      "<b>Student ID:</b> " + studentId +
      "<br>" +
      "Data akan dikirim ke SIPETRA saat internet tersedia.";

  } catch (error) {

    hasil.innerHTML =
      "<div class='error'>❌ ABSENSI GAGAL</div>" +
      "<br>" +
      "Data offline tidak dapat disimpan.";

  }

  sedangProsesAbsensi = false;

  delete window[callbackName];

  script.remove();
};

  document.body.appendChild(script);
}

    function onScanFailure(error) {
      // Scanner tetap berjalan.
    }

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );

    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  </script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("SIPETRA Service Worker aktif"))
      .catch(error => console.error("Service Worker gagal:", error));
  }
</script>
  <script>
function updateStatusKoneksi() {
  const status = document.getElementById("statusKoneksi");

  if (navigator.onLine) {
    status.innerHTML = "🟢 Online — terhubung ke SIPETRA";
  } else {
    status.innerHTML = "🟠 Offline — data tersimpan di perangkat";
  }
}

window.addEventListener("online", updateStatusKoneksi);
window.addEventListener("offline", updateStatusKoneksi);

updateStatusKoneksi();
</script>
</body>
</html>
